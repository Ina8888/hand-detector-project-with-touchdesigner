<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Controller - Ina Design / Bina Kopp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nicomoji@1.0.5/nicomoji-plus.css">
    <style>
        @import url('https://cdn.jsdelivr.net/npm/nicomoji@1.0.5/nicomoji-plus.css');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap');
        @import url(https://db.onlinewebfonts.com/c/73c00071d90ecfb78bf0ccdeda529307?family=Nico+Moji);
        @font-face {
            font-family: "Nico Moji";
            src: url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.eot");
            src: url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.eot?#iefix")format("embedded-opentype"),
            url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.woff2")format("woff2"),
            url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.woff")format("woff"),
            url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.ttf")format("truetype"),
            url("https://db.onlinewebfonts.com/t/73c00071d90ecfb78bf0ccdeda529307.svg#Nico Moji")format("svg");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            color: #ffffff;
            font-family: 'Nico Moji', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .header {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }

        .main-title {
            font-size: 50px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: white; /*#DE009C;*/
            text-shadow: 0 0 15px rgba(222, 0, 156, 0.6);
        }

        .subtitle {
            font-size: 20px;
            color: #00DF56;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .mode-buttons {
            font-size: 20px;
            position: fixed;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .mode-btn {
            background: rgba(93, 4, 67, 0.8);
            border: 2px solid #DE009C;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Nico Moji', 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 1px;
            min-width: 160px;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(222, 0, 156, 0.3);
            border-color: #00DF56;
            transform: translateX(5px);
        }

        .mode-btn.active {
            background: rgba(0, 223, 86, 0.2);
            border-color: #00DF56;
            box-shadow: 0 0 20px rgba(0, 223, 86, 0.4);
        }

        .mode-btn .icon {
            font-size: 20px;
            opacity: 0.9;
        }

        .mode-btn .label {
            font-size: 16px;
            text-transform: lowercase;
            color: #ffffff;
        }

        /* Info Panel */
        .info-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(93, 4, 67, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #DE009C;
            backdrop-filter: blur(10px);
        }

        .status-item {
            margin-bottom: 6px;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .connected {
            color: #00DF56 !important;
        }

        .disconnected {
            color: #DE009C !important;
        }

        #connection-status, #gesture-display, #mode-display {
            font-family: 'Nico Moji'sans-serif;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(93, 4, 67, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #DE009C;
            backdrop-filter: blur(10px);
        }

        .social {
            font-size: 14px;
            color: #00DF56;
            letter-spacing: 1px;
            font-family: 'Nico Moji', 'Courier New', monospace;
            border-radius: 10px;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            font-family: 'Nico Moji', 'Courier New', monospace;
        }

        .loading-text {
            color: #DE009C;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(222, 0, 156, 0.6);
        }

        @media (max-width: 768px) {
            .mode-buttons {
                font-size: 20px;
                flex-direction: row;
                top: auto;
                bottom: 100px;
                left: 20px;
                right: 20px;
                transform: none;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .mode-btn {
                flex: 1;
                min-width: 120px;
                justify-content: center;
                padding: 10px;
            }
            
            .header {
                top: 20px;
                left: 20px;
            }
            
            .header .main-title {
                font-size: 22px;
            }
            
            .header .subtitle {
                font-size: 14px;
            }
            
            .info-panel {
                bottom: 20px;
                left: 20px;
            }
            
            .footer {
                bottom: 20px;
                right: 20px;
                padding: 8px 12px;
            }
            
            .social {
                font-size: 12px;
            }
        }


/*not really needed for now*/
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(93, 4, 67, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #DE009C;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00DF56;
        }



    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-text">Starting Hand Controller...</div>
    </div>

    <header class="header">
        <div class="title-section">
            <h1 class="main-title">Hand Controller</h1>
            <p class="subtitle">Ina Design / Bina Kopp</p>
        </div>
    </header>

    <nav class="mode-buttons">
        <button class="mode-btn active" data-mode="sphere">
            <span class="icon">●</span>
            <span class="label">sphere</span>
        </button>
        <button class="mode-btn" data-mode="sand">
            <span class="icon">⋰</span>
            <span class="label">sand</span>
        </button>
        <button class="mode-btn" data-mode="wave">
            <span class="icon">〰</span>
            <span class="label">wave</span>
        </button>
        <button class="mode-btn" data-mode="cosmic">
            <span class="icon">✦</span>
            <span class="label">cosmic</span>
        </button>
    </nav>

    <div class="info-panel">
        <div class="status-item">
            <span id="connection-status">● Connected to server.</span>
        </div>
        <div class="status-item">
            <span id="mode-display">Model sphere</span>
        </div>
    </div>

    <footer class="footer">
        <p class="social">Follow @binakopp</p>
    </footer>

    <div id="canvas-container"></div>

   <script>
    console.log("🚀 Starting Hand Controller...");
    
    let handData = {
        wrist: [0.5, 0.5, 0],
        gesture: 'none',
        fingers: [0,0,0,0,0],
        landmarks: []
    };

    let currentMode = 'sphere';
    let particles = [];
    let trails = [];

    const modes = {
        sphere: {
            stars: [],
            init: function() {
                this.stars = [];
                for (let i = 0; i < 200; i++) {
                    this.stars.push({
                        x: random(-width, width),
                        y: random(-height, height),
                        z: random(-1000, 1000),
                        size: random(0.5, 2),
                        brightness: random(100, 255),
                        color: random() > 0.5 ? [222, 0, 156] : [0, 223, 86]
                    });
                }
            },
            draw: function() {
                background(0, 0, 0, 20); 
                
                let handX = map(handData.wrist[0], 0, 1, -width/2, width/2);
                let handY = map(handData.wrist[1], 0, 1, -height/2, height/2);
                let handZ = map(handData.wrist[2], -0.2, 0.2, -200, 200);
                
                console.log("🖐️ Sphere Mode - Hand position:", handX.toFixed(0), handY.toFixed(0));
                
                pointLight(222, 0, 156, handX, handY, 200);
                pointLight(0, 223, 86, -handX, -handY, 100);
                
                push();
                translate(handX, handY, handZ);

                if (handData.gesture === 'open') {
                    fill(222, 0, 156, 150);
                    stroke(222, 100, 200);
                    sphere(80);
                    
                    let time = millis() * 0.001;
                    for (let i = 0; i < 3; i++) {
                        push();
                        rotateX(time * 20 + i * 120);
                        rotateY(time * 30 + i * 120);
                        translate(120, 0, 0);
                        fill(0, 223, 86, 200);
                        noStroke();
                        sphere(15);
                        pop();
                    }
                } else {
                    fill(93, 4, 67, 200);
                    stroke(222, 0, 156);
                    sphere(60);
                    
                    if (frameCount % 3 === 0) {
                        for (let i = 0; i < 2; i++) {
                            particles.push({
                                x: handX + random(-20, 20),
                                y: handY + random(-20, 20),
                                z: handZ + random(-20, 20),
                                vx: random(-2, 2),
                                vy: random(-2, 2),
                                vz: random(-1, 1),
                                life: 255,
                                size: random(2, 5),
                                color: [random(200, 255), random(0, 100), random(150, 200)]
                            });
                        }
                    }
                }
                pop();
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.z += p.vz;
                    p.life -= 4;
                    
                    push();
                    translate(p.x, p.y, p.z);
                    fill(p.color[0], p.color[1], p.color[2], p.life);
                    noStroke();
                    sphere(p.size);
                    pop();
                    
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }
        },

        sand: {
            particles: [],
            init: function() {
                this.particles = [];
            },
            draw: function() {
                background(5,5,20);
                
                let handX = map(handData.wrist[0], 0, 1, -width/2, width/2);
                let handY = map(handData.wrist[1], 0, 1, -height/2, height/2);
                
                if (frameCount % 2 === 0) {
                    for (let i = 0; i < 5; i++) {
                        this.particles.push({
                            x: handX + random(-80, 80),
                            y: handY + random(-80, 80),
                            z: random(-200, 200),
                            vx: random(-3, 3),
                            vy: random(-3, 3),
                            vz: random(-2, 2),
                            life: 255,
                            size: random(1, 4),
                            color: [222, 0, 156]
                        });
                    }
                }
                
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    
                    p.x += p.vx;
                    p.y += p.vy;
                    p.z += p.vz;
                    p.life -= 2;
                    
                    p.vy += 0.1;
                    
                    let distToHand = dist(p.x, p.y, handX, handY);
                    if (distToHand < 150) {
                        p.vx += (handX - p.x) * 0.01;
                        p.vy += (handY - p.y) * 0.01;
                    }
                    
                    push();
                    translate(p.x, p.y, p.z);
                    fill(p.color[0], p.color[1], p.color[2], p.life);
                    noStroke();
                    sphere(p.size);
                    pop();
                    
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
                
                if (this.particles.length > 800) {
                    this.particles.splice(0, 100);
                }
            }
        },

        wave: {
            grid: [],
            init: function() {
                this.createWaveGrid();
            },
            createWaveGrid: function() {
                this.grid = [];
                // More dots for better effect
                let spacing = 15;
                for (let x = -width/2; x < width/2; x += spacing) {
                    for (let y = -height/2; y < height/2; y += spacing) {
                        this.grid.push({
                            x: x, y: y, z: 0,
                            offset: random(1000),
                            originalX: x,
                            originalY: y
                        });
                    }
                }
            },
            draw: function() {
                background(0, 0, 0, 20);
                
                let handX = map(handData.wrist[0], 0, 1, -width/2, width/2);
                let handY = map(handData.wrist[1], 0, 1, -height/2, height/2);
                let handZ = map(handData.wrist[2], -0.5, 0.5, -100, 100);
                
                if (this.grid.length === 0) {
                    this.createWaveGrid();
                }
                
                for (let point of this.grid) {
                    let handDist = dist(point.x, point.y, handX, handY);
                    let wave = sin(frameCount * 0.05 + point.offset) * 20;
                    
                    // Strong hand influence
                    if (handDist < 250) {
                        wave += sin(handDist * 0.1 - frameCount * 0.1) * 40 * (1 - handDist/250);
                        
                        // Push points away from hand
                        let angle = atan2(point.y - handY, point.x - handX);
                        point.x += cos(angle) * 0.5;
                        point.y += sin(angle) * 0.5;
                    }
                    
                    // Return to original position
                    point.x += (point.originalX - point.x) * 0.05;
                    point.y += (point.originalY - point.y) * 0.05;
                    
                    point.z = wave;
                    
                    push();
                    translate(point.x, point.y, point.z);
                    
                    let alpha = map(handDist, 0, 250, 255, 50);
                    if (handDist < 100) {
                        fill(0, 223, 86, alpha);
                    } else {
                        fill(222, 0, 156, alpha);
                    }
                    noStroke();
                    sphere(3);
                    pop();
                }
            }
        },

        cosmic: {
            stars: [],
            init: function() {
                this.stars = [];
                for (let i = 0; i < 200; i++) {
                    this.stars.push({
                        x: random(-width, width),
                        y: random(-height, height),
                        z: random(-1000, 1000),
                        size: random(0.5, 2),
                        brightness: random(100, 255),
                        color: random() > 0.5 ? [222, 0, 156] : [0, 223, 86]
                    });
                }
            },
            draw: function() {
                background(5, 5, 20);
                
                let handX = map(handData.wrist[0], 0, 1, -width/2, width/2);
                let handY = map(handData.wrist[1], 0, 1, -height/2, height/2);
                let handZ = map(handData.wrist[2], -0.2, 0.2, -500, 500);
                
                for (let star of this.stars) {
                    push();
                    translate(star.x, star.y, star.z);
                    fill(star.color[0], star.color[1], star.color[2], star.brightness);
                    noStroke();
                    sphere(star.size);
                    pop();
                }
                
                push();
                translate(handX, handY, handZ);
                
                fill(93, 4, 67); 
                noStroke();
                sphere(40);
                
                rotateX(frameCount * 0.5);
                noFill();
                stroke(222, 0, 156, 100);
                strokeWeight(4);
                torus(80, 8);
                
                stroke(0, 223, 86, 80);
                torus(120, 6);
                pop();
            }
        }
    };

    function setup() {
        console.log("✅ Setup started");
        
        let canvas = createCanvas(windowWidth, windowHeight, WEBGL);
        canvas.parent('canvas-container');
        angleMode(DEGREES);
        
        modes.wave.init();
        modes.cosmic.init();
        
        document.getElementById('loading').style.display = 'none';
        console.log("✅ Loading screen hidden");
        
        fetchHandData();
    }

    function fetchHandData() {
        console.log("🔄 Starting hand data fetch...");
        setInterval(async () => {
            try {
                const response = await fetch('http://localhost:5000/hand-data');
                const data = await response.json();
                handData = data;
                
                console.log("📡 Received hand data:", 
                    `X: ${data.wrist[0].toFixed(2)}, ` +
                    `Y: ${data.wrist[1].toFixed(2)}, ` +
                    `Gesture: ${data.gesture}`
                );
                
                document.getElementById('connection-status').textContent = '● Connected to server.';
                document.getElementById('connection-status').className = 'connected';
                    
            } catch (error) {
                console.log("❌ Cannot connect to server:", error);
                document.getElementById('connection-status').textContent = '● Disconnected - Start Python Server';
                document.getElementById('connection-status').className = 'disconnected';
            }
        }, 50);
    }

    function draw() {
        if (modes[currentMode] && modes[currentMode].draw) {
            modes[currentMode].draw();
        } else {
            // Fallback
            background(0);
            fill(255);
            textSize(20);
            textAlign(CENTER, CENTER);
            text(`Mode ${currentMode} not working`, 0, 0);
        }
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            currentMode = this.dataset.mode;
            document.getElementById('mode-display').textContent = 'Model ' + this.querySelector('.label').textContent;
        });
    });
</script>
</body>
</html>
